<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;700;800&display=swap">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a {
      color: #C9A961;
      text-decoration: none;
    }
    a:hover {
      color: #F0D98C;
    }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(160deg, #2C4B6B 0%, #1B3450 46%, #101C2B 100%); color: #F2F5F9; overflow: hidden; display: flex; flex-direction: column; padding: 20px 24px 0;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="app-icon.jpg" alt="BookSafe" style="width: 30px; height: 30px; border-radius: 8px; display: block;">
      <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em;">BookSafe</span>
    </div>
    <span style="font-size: 13px; color: rgba(242, 245, 249, 0.85); border: 1px solid rgba(242, 245, 249, 0.35); border-radius: 999px; padding: 4px 12px;">English</span>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; margin-top: 28px;">
    <span style="display: block; width: 32px; height: 2px; background: {{accent}};"></span>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}};">BookSafe 1.1 · Apple Watch</span>
  </div>

  <h1 style="font-family: 'Saira', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.02; margin: 16px 0 0;">Deine Bibliothek<br>gehört <span style="color: {{accent}};">dir.</span></h1>

  <p style="font-size: 17px; color: rgba(242, 245, 249, 0.82); margin: 18px 0 0;">Scannen, Reihen im Griff, Lesezeit am Handgelenk starten — ohne Konto, ohne Tracking, ohne Abo.</p>

  <div style="display: flex; align-items: center; gap: 16px; margin-top: 24px;">
    <img src="badge-de.svg" alt="Laden im App Store" style="height: 48px; width: auto; display: block;">
    <span style="font-size: 12px; line-height: 1.4; color: rgba(242, 245, 249, 0.75);">Kostenlos bis<br>50 Bücher.</span>
  </div>

  <div style="position: relative; flex-grow: 1; margin-top: 18px;">
    <img src="shot-library.jpg" alt="Bibliothek in BookSafe" style="position: absolute; right: -24px; top: 0; width: 214px; border-radius: 22px 0 0 0; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); display: block;">
    <div style="position: absolute; left: 0; top: 96px; width: 152px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(242, 245, 249, 0.14); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);">
      <img src="shot-watch.jpg" alt="Lesesitzung auf der Apple Watch" style="width: 100%; display: block;">
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A961","options":["#C9A961","#F0D98C","#9A7E3F","#E9C870"],"section":"Marke"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C9A961' };
  }
}
</script>
</body>
</html>
