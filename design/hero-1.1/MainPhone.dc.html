<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a {
      color: #C9A961;
      text-decoration: none;
    }
    a:hover {
      color: #F0D98C;
    }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #2C4B6B 0%, #1B3450 100%); color: #F2F5F9; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 20px 24px 0;">

  <div style="width: 100%; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="app-icon.jpg" alt="BookSafe" style="width: 30px; height: 30px; border-radius: 8px; display: block;">
      <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em;">BookSafe</span>
    </div>
    <span style="font-size: 13px; color: rgba(242, 245, 249, 0.85); border: 1px solid rgba(242, 245, 249, 0.35); border-radius: 999px; padding: 4px 12px;">English</span>
  </div>

  <span style="display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: {{accent}}; border: 1px solid {{accent}}; border-radius: 999px; padding: 5px 13px; margin-top: 26px;">Neu in 1.1 · Apple Watch</span>

  <h1 style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin: 18px 0 0; text-align: center;">Deine Bibliothek.<br><span style="color: {{accent}};">Schön, schnell, privat.</span></h1>

  <p style="font-size: 17px; color: rgba(242, 245, 249, 0.82); margin: 14px 0 0; text-align: center;">Die Buch-App ohne Konto, ohne Tracking, ohne Abo — für iPhone, iPad und Apple&nbsp;Watch.</p>

  <img src="badge-de.svg" alt="Laden im App Store" style="height: 48px; width: auto; display: block; margin-top: 22px;">

  <span style="font-size: 13px; line-height: 1.45; color: rgba(242, 245, 249, 0.75); margin-top: 12px; text-align: center;">Kostenlos bis 50 Bücher.<br>Pro: einmalig 3,99 € — kein Abo.</span>

  <div style="position: relative; width: 342px; flex-grow: 1; margin-top: 16px;">
    <img src="shot-today.jpg" alt="Heute-Tab in BookSafe" style="position: absolute; right: 6px; top: 0; width: 208px; border-radius: 22px 22px 0 0; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); display: block;">
    <div style="position: absolute; left: 0; top: 150px; width: 136px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(242, 245, 249, 0.14); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);">
      <img src="shot-watch.jpg" alt="Lesesitzung auf der Apple Watch" style="width: 100%; display: block;">
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A961","options":["#C9A961","#F0D98C","#9A7E3F","#E9C870"],"section":"Marke"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return { accent: this.props.accent ?? '#C9A961' };
  }
}
</script>

</html>
