  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #444; font-family: "Source Sans 3", sans-serif; }

  /* 1200 x 630 — das Seitenverhaeltnis, das Open Graph und Twitter Cards
     erwarten. Alles muss noch lesbar sein, wenn die Karte in einer Timeline
     auf ~300 px Breite schrumpft: eine grosse Zeile, ein Bildmotiv, sonst nichts. */
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: linear-gradient(160deg, #2C4B6B 0%, #1B3450 46%, #101C2B 100%);
    color: #F2F5F9;
  }
  .glow {
    position: absolute;
    right: -8%;
    top: -60px;
    width: 62%;
    height: 720px;
    background: radial-gradient(circle at 50% 45%, rgba(92, 130, 166, 0.30) 0%, transparent 68%);
  }
  .copy { position: relative; padding: 56px 0 0 64px; width: 660px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; display: block; }
  .brand span { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  h1 {
    font-family: "Saira", sans-serif;
    font-weight: 800;
    font-size: 68px;
    letter-spacing: -0.025em;
    line-height: 1.03;
    margin: 76px 0 0;
  }
  h1 em { font-style: normal; color: #C9A961; }
  .sub { font-size: 24px; color: rgba(242, 245, 249, 0.82); margin-top: 22px; }
  .url {
    position: absolute;
    left: 64px;
    bottom: 44px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #C9A961;
  }

  .shots { position: absolute; right: 0; top: 0; width: 520px; height: 630px; }
  .shots img, .shots .watch {
    position: absolute;
    border-radius: 22px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    display: block;
  }
  .shots .phone { right: 40px; top: 92px; width: 268px; }
  .shots .watch {
    right: 286px;
    top: 300px;
    width: 190px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .shots .watch img { position: static; width: 100%; border-radius: 0; box-shadow: none; }
</style>
</head>

<div class="card">
  <div class="glow"></div>
